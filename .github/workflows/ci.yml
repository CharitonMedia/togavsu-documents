name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: pg
        ports:
          - 5432:5432
    env:
      # A superuser URL: coretest creates and drops its own databases and roles.
      TOGAVSU_TEST_DATABASE_URL: postgres://postgres:pg@127.0.0.1:5432/postgres?sslmode=disable
      GOPRIVATE: github.com/CharitonMedia
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - name: Wait for Postgres
        run: until pg_isready -h 127.0.0.1 -p 5432 -U postgres; do sleep 1; done
      - run: go test -race ./...
      # The kit's own check of the package as the pinned core installs it: the parts
      # package/pending.yaml lists are held back while the core refuses them.
      - name: Package check
        run: go run github.com/CharitonMedia/togavsu/cmd/togavsu-module check -installable package
      - name: Docker build
        run: docker build -t togavsu-documents .
